services:
  - type: web
    name: jobappfrnd
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: "1234"
