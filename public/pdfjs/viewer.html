<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF পড়ুন — JobAppFrnd</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #0b0e1a; color: #f2f4ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", "Noto Sans Bengali", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #141a33; border-bottom: 1px solid rgba(255,255,255,.1); flex: none; flex-wrap: wrap; }
  .toolbar button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #f2f4ff; border-radius: 9px; padding: 7px 11px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .toolbar button:active { transform: scale(.96); }
  .toolbar button:disabled { opacity: .4; }
  .toolbar .pg { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; }
  .toolbar input { width: 52px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.16); border-radius: 8px; color: #f2f4ff; padding: 7px 6px; font-size: 14px; text-align: center; font-family: inherit; }
  .toolbar .spacer { flex: 1; }
  .toolbar a { color: #7dd3fc; font-size: 13px; font-weight: 700; text-decoration: none; }
  .stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 14px 10px 24px; -webkit-overflow-scrolling: touch; }
  canvas { background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.6); max-width: 100%; height: auto !important; }
  .msg { text-align: center; color: #9aa0c3; padding: 40px 20px; font-size: 15px; line-height: 1.7; }
  .msg b { color: #f2f4ff; }
  .msg a { color: #7dd3fc; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="prev" disabled>‹ পেছনে</button>
  <div class="pg">পৃষ্ঠা <input id="pgnum" type="number" min="1" value="1"> / <span id="pgcount">–</span></div>
  <button id="next" disabled>এগিয়ে ›</button>
  <div class="spacer"></div>
  <button id="zoom-out">−</button>
  <button id="zoom-in">+</button>
  <button id="fit">↔ ফিট</button>
  <a id="dl" href="#" target="_blank" rel="noopener">⬇️ ডাউনলোড</a>
</div>
<div class="stage" id="stage">
  <div class="msg" id="msg">⏳ পিডিএফ লোড হচ্ছে…</div>
  <canvas id="cv" class="hidden"></canvas>
</div>
<script src="pdf.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var file = params.get('file');
  var msg = document.getElementById('msg');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var pdf = null, pageNum = 1, scale = 1, fitScale = 1, rendering = false, pending = null;

  if (!file) { msg.innerHTML = '<b>কোনো PDF দেওয়া হয়নি।</b>'; return; }
  document.getElementById('dl').href = file;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.js';

  function showError(text) {
    msg.classList.remove('hidden');
    cv.classList.add('hidden');
    msg.innerHTML = '<b>❌ PDF খোলা যায়নি।</b><br>' + text + '<br><br><a href="' + file + '" target="_blank" rel="noopener">⬇️ PDF ডাউনলোড করে দেখুন</a>';
  }

  function renderPage(num) {
    rendering = true;
    pdf.getPage(num).then(function (page) {
      var viewport = page.getViewport({ scale: scale });
      var dpr = window.devicePixelRatio || 1;
      cv.width = Math.floor(viewport.width * dpr);
      cv.height = Math.floor(viewport.height * dpr);
      cv.style.width = Math.floor(viewport.width) + 'px';
      cv.style.height = Math.floor(viewport.height) + 'px';
      var renderCtx = { canvasContext: ctx, viewport: viewport, transform: [dpr, 0, 0, dpr, 0, 0] };
      return page.render(renderCtx).promise;
    }).then(function () {
      rendering = false;
      document.getElementById('pgnum').value = num;
      document.getElementById('prev').disabled = (num <= 1);
      document.getElementById('next').disabled = (num >= pdf.numPages);
      if (pending !== null) { var n = pending; pending = null; goTo(n); }
    }).catch(function (e) { rendering = false; showError('পৃষ্ঠা রেন্ডার হয়নি।'); });
  }

  function goTo(num) {
    if (!pdf) return;
    num = Math.max(1, Math.min(pdf.numPages, num));
    if (rendering) { pending = num; return; }
    pageNum = num;
    renderPage(num);
  }

  function fitWidth() {
    if (!pdf) return;
    pdf.getPage(pageNum).then(function (page) {
      var vp = page.getViewport({ scale: 1 });
      var stageW = document.getElementById('stage').clientWidth - 20;
      fitScale = stageW / vp.width;
      scale = fitScale;
      renderPage(pageNum);
    });
  }

  document.getElementById('prev').onclick = function () { goTo(pageNum - 1); };
  document.getElementById('next').onclick = function () { goTo(pageNum + 1); };
  document.getElementById('pgnum').onchange = function () { goTo(parseInt(this.value, 10) || 1); };
  document.getElementById('zoom-in').onclick = function () { scale = Math.min(scale * 1.25, 4); renderPage(pageNum); };
  document.getElementById('zoom-out').onclick = function () { scale = Math.max(scale / 1.25, 0.4); renderPage(pageNum); };
  document.getElementById('fit').onclick = fitWidth;

  pdfjsLib.getDocument({
    url: file,
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
    cMapPacked: true,
    standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
  }).promise.then(function (doc) {
    pdf = doc;
    document.getElementById('pgcount').innerText = doc.numPages;
    msg.classList.add('hidden');
    cv.classList.remove('hidden');
    fitWidth();
  }).catch(function (e) {
    showError('ফাইলটি পাওয়া যায়নি বা PDF নয়।');
  });
})();
</script>
</body>
</html>
